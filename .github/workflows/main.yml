name: Java CI with JUnit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Download JUnit Platform Console Standalone
      - name: Download JUnit
        run: |
          curl -L -o junit.jar \
          https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar

      # 4. Compile all Java files (including tests)
      - name: Compile Java files
        run: javac -cp .:junit.jar *.java

      # 5. Run tests
      - name: Run JUnit tests
        run: java -jar junit.jar --scan-classpath
