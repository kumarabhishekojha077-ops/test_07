name: Java CI Pipeline (Multi-Stage Flow)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # =========================
  # 1. BUILD STAGE
  # =========================
  build:
    name: Build Stage (Compile Code)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compile Java source files
        run: javac *.java

      - name: Save compiled output
        uses: actions/upload-artifact@v4
        with:
          name: compiled-classes
          path: "*.class"


  # =========================
  # 2. TEST STAGE
  # =========================
  test:
    name: Test Stage (JUnit Tests)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: compiled-classes

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download JUnit
        run: |
          curl -L -o junit.jar \
          https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar

      - name: Compile tests with JUnit
        run: javac -cp .:junit.jar *.java

      - name: Run tests
        run: java -jar junit.jar --scan-classpath


  # =========================
  # 3. RUN STAGE
  # =========================
  run:
    name: Run Application
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compile program
        run: javac *.java

      - name: Run application
        run: java Student
